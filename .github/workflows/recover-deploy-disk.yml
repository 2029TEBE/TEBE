name: Reclaim unused production build cache
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-deploy-disk.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: epmo-production-deployment
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == '2029TEBE/TEBE'
    runs-on: [self-hosted, linux, x64, servitro-tebe]
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: epmo-tested-images-66345499235b623c7423aa5944abca3fbcc2dc75
          path: ${{ runner.temp }}/identity-diagnostic
          github-token: ${{ github.token }}
          run-id: 43946933613
      - name: Diagnose runtime identity without changing VPS state
        env:
          DEPLOY_HOST: ${{ secrets.EPMO_PROD_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.EPMO_PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.EPMO_PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9_.@-]+$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf -- "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          unset DEPLOY_KEY KNOWN_HOSTS
          ssh -i "$keydir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$keydir/known_hosts" -- "$DEPLOY_HOST" "docker image inspect epmo-api:ci" | node scripts/diagnose-image-runtime.mjs "$RUNNER_TEMP/identity-diagnostic/images.tar.gz" api
          ssh -i "$keydir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$keydir/known_hosts" -- "$DEPLOY_HOST" "docker image inspect epmo-web:ci" | node scripts/diagnose-image-runtime.mjs "$RUNNER_TEMP/identity-diagnostic/images.tar.gz" web
          node -e 'const m=require(process.argv[1]); console.log(JSON.stringify(m.images,null,2))' "$RUNNER_TEMP/identity-diagnostic/manifest.json"
# No image/container/volume pruning, backup removal, migration or app restart.
