name: Reclaim unused production build cache
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-deploy-disk.yml]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: epmo-production-deployment
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == '2029TEBE/TEBE'
    runs-on: [self-hosted, linux, x64, servitro-tebe]
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only runner storage inventory
        shell: bash
        run: |
          set -euo pipefail
          id
          printf 'Runner=%s temp=%s workspace=%s\n' "$RUNNER_NAME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS
          df -hT
          df -i
          findmnt -rn -o TARGET,SOURCE,FSTYPE
          for path in "$HOME" /opt /var/cache /var/log /var/lib/docker /var/lib/containerd /tmp /mnt /srv; do
            if [[ -d "$path" ]]; then
              echo "Directory usage: $path"
              du -x -h --max-depth=2 "$path" 2>/dev/null | sort -h | tail -25 || true
            fi
          done
          systemctl list-units --type=service --all --no-pager | grep -E 'actions.runner|docker|containerd' || true
          if command -v docker >/dev/null; then
            docker info --format 'DockerRootDir={{.DockerRootDir}}' || true
            docker system df -v || true
            docker ps -a --format '{{.ID}} {{.Image}} {{.Status}}' || true
          fi
      - name: Read-only production storage inventory
        env:
          DEPLOY_HOST: ${{ secrets.EPMO_PROD_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.EPMO_PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.EPMO_PROD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9_.@-]+$ ]]
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/epmo-storage-ssh.XXXXXXXX")
          trap 'rm -rf -- "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          unset DEPLOY_KEY KNOWN_HOSTS
          ssh -i "$keydir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$keydir/known_hosts" -- "$DEPLOY_HOST" 'set -eu; id; df -hT; df -i; findmnt -rn -o TARGET,SOURCE,FSTYPE; stat -c "%d %n" /opt/the-epmo /var/lib/docker /tmp; docker info --format "DockerRootDir={{.DockerRootDir}}"; docker version --format "Client={{.Client.Version}} Server={{.Server.Version}}"; for image in epmo-api:ci epmo-web:ci; do echo "Candidate identity: $image"; if docker image inspect "$image" >/dev/null 2>&1; then docker image inspect "$image" | node /opt/the-epmo/scripts/ci-image-bundle.mjs identity; fi; done; docker system df -v; docker ps -a --format "{{.ID}} {{.Image}} {{.Status}}"; for p in /opt /var/cache /var/log /var/lib/docker /var/lib/containerd /tmp /mnt /srv; do if test -d "$p"; then echo "Directory usage: $p"; du -x -h --max-depth=2 "$p" 2>/dev/null | sort -h | tail -25; fi; done'
      - name: Reclaim abandoned release scratch and report low runner capacity
        env:
          SCRATCH_ROOT: ${{ vars.EPMO_DEPLOY_SCRATCH_ROOT }}
        run: |
          set -euo pipefail
          root=$(realpath -e -- "${SCRATCH_ROOT:-$RUNNER_TEMP}")
          find "$root" -mindepth 1 -maxdepth 1 -type d -user "$(id -u)" \
            \( -name 'epmo-verified-release.????????' -o -name 'epmo-deploy-ssh.????????' -o -name 'epmo-storage-ssh.????????' \) -mmin +180 -exec rm -rf -- {} +
          free_kib=$(df -Pk "$root" | awk 'END { print $4 }')
          free_inodes=$(df -Pi "$root" | awk 'END { print $4 }')
          [[ "$free_kib" =~ ^[0-9]+$ && "$free_inodes" =~ ^[0-9]+$ ]]
          printf 'Runner storage: %s KiB and %s inodes free.\n' "$free_kib" "$free_inodes" >> "$GITHUB_STEP_SUMMARY"
          if (( free_kib < 4194304 || free_inodes < 4096 )); then
            echo '::warning title=Runner storage low::Less than 4 GiB or 4096 inodes free. Check capacity before the next release.'
          fi
      - name: Apply bounded storage retention and report capacity
        env:
          DEPLOY_HOST: ${{ secrets.EPMO_PROD_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.EPMO_PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.EPMO_PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9_.@-]+$ ]]
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf -- "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$keydir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$keydir/known_hosts"
          unset DEPLOY_KEY KNOWN_HOSTS
          echo 'Runner available space before recovery:'
          df -h "$RUNNER_TEMP" || true
          ssh -i "$keydir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$keydir/known_hosts" -- "$DEPLOY_HOST" 'bash -s' < infra/storage-maintenance.sh
          echo 'Runner available space after recovery:'
          df -h "$RUNNER_TEMP" || true
          echo 'Production runtime after maintenance:' | tee -a "$GITHUB_STEP_SUMMARY"
          ssh -i "$keydir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o "UserKnownHostsFile=$keydir/known_hosts" -- "$DEPLOY_HOST" 'bash -s' <<'REMOTE' | tee -a "$GITHUB_STEP_SUMMARY"
          set -euo pipefail
          cd /opt/the-epmo
          revision=$(cat .deployed-revision 2>/dev/null || true)
          if [[ ! "$revision" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Verified release marker unavailable.'
            revision=
          fi
          for service in api web; do
            container=$(docker compose -f docker-compose.prod.yml -p pmo-prod --env-file .env.prod ps -q "$service")
            [[ "$container" =~ ^[a-f0-9]{12,64}$ ]]
            read -r image health < <(docker inspect --format '{{.Image}} {{.State.Health.Status}}' "$container")
            [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
            [[ "$health" == healthy ]]
            image_revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
            if [[ ! "$image_revision" =~ ^[a-f0-9]{40}$ ]]; then image_revision=unavailable; fi
            printf '%s image=%s revision=%s health=%s\n' "$service" "$image" "$image_revision" "$health"
            if [[ -z "$revision" || "$image_revision" != "$revision" ]]; then
              printf '::warning::Running %s revision is not attested by the release marker.\n' "$service"
            fi
          done
          REMOTE
# Current/container-referenced images and explicit rollback tags remain intact.
# Dangling images: 24h; unused build cache: 7d; obsolete managed release aliases: 7d.
