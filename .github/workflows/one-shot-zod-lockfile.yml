name: One-shot Zod and image-size lockfile refresh
on:
  push:
    branches: [security/p0-paddle-zod-image-20261105]
permissions: { contents: write }
jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[lockfile-refreshed]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile to this review branch only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(security): update lockfile [lockfile-refreshed]"
            git push origin HEAD:refs/heads/security/p0-paddle-zod-image-20261105
          fi
