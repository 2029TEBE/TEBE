name: Generate transitive high-severity dependency patches
on:
  push:
    branches:
      - security/patch-transitive-high-20261109
    paths:
      - .github/workflows/transitive-high-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install existing lockfile
        run: pnpm install --frozen-lockfile
      - name: Patch compatible transitive packages
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='package.json', pkg=JSON.parse(fs.readFileSync(p,'utf8'));
          pkg.pnpm ??= {}; pkg.pnpm.overrides ??= {};
          Object.assign(pkg.pnpm.overrides,{
            'multer': '2.5.0',
            'body-parser': '1.20.9',
            'postcss': '8.5.28',
            'source-map-js': '1.2.2'
          });
          fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');
          NODE
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Validate packages and TypeScript
        run: |
          pnpm build:packages
          pnpm typecheck
      - name: Commit resolved and verified dependency graph
        run: |
          set -euo pipefail
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): patch transitive high-severity packages and lockfile [security-lockfile]'
          git push origin HEAD:security/patch-transitive-high-20261109
