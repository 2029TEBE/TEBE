name: Publish release image pair

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-release-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish API and web images for the checked-out revision
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          export DOCKER_CONFIG="$work/docker"
          mkdir "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in api web; do
            image="$registry-$service"
            docker buildx build --platform linux/amd64 --push \
              --file "apps/$service/Dockerfile" --tag "$image:$GITHUB_SHA" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --metadata-file "$work/$service.json" .
            digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$work/$service.json")
            printf '%s=%s@%s\n' "EPMO_RELEASE_${service^^}_IMAGE" "$image" "$digest" >> "$work/images.env"
          done
          {
            printf 'Revision: `%s`\n\n' "$GITHUB_SHA"
            printf 'Use this pair for staging first. Record the smoke-test result before promotion.\n\n'
            printf '```shell\n'
            cat "$work/images.env"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
