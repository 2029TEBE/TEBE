name: Repair Vitest Vite peer lockfile
on:
  push:
    branches: [security/vite-peer-resolution-20261109]
    paths: [.github/workflows/vite-peer-resolution.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Explicitly align Vitest's peer with patched Vite
        run: |
          pnpm add -Dw vite@8.2.4
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Validate type and offline tests
        run: pnpm build:packages && pnpm typecheck && npm run test:offline
      - name: Commit if validated
        run: |
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): resolve Vitest peer using patched Vite'
          git push origin HEAD:security/vite-peer-resolution-20261109
