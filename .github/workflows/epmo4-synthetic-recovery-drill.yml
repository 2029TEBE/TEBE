name: EPMO4 disposable encrypted PostgreSQL recovery proof (nondeploying)
# Re-run on each new canonical integration PR, not only when this workflow changes.
# Noncanonical source PRs are skipped below; no deployment or external secrets.
on:
  pull_request:
permissions:
  contents: read
jobs:
  disposable-recovery:
    name: Real disposable Docker backup-restore-rollback
    # Exact-head synthetic recovery is required for canonical Q integration PRs.
    # The one S56 branch exception allows this trigger repair to prove itself.
    # Forks and unrelated source PRs cannot run Docker on this job.
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.event.pull_request.head.ref, 'integration/q') ||
         github.event.pull_request.head.ref == 'epmo4/s56-canonical-recovery-trigger-20261101')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PG_IMAGE: 'postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real isolated synthetic recovery and emit redacted receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          umask 077
          key_file="$RUNNER_TEMP/epmo4-s55-ephemeral-key"
          log_file="$RUNNER_TEMP/epmo4-s55-private.log"
          evidence_file="$RUNNER_TEMP/epmo4-s55-evidence.json"
          trap 'rm -f "$key_file" "$log_file"' EXIT
          node -e "process.stdout.write(require('node:crypto').randomBytes(32))" > "$key_file"
          rc=1
          if docker pull "$PG_IMAGE" > "$log_file" 2>&1; then
            set +e
            env -i PATH="$PATH" HOME="$RUNNER_TEMP" DEPLOYMENT_ENV=staging EPMO_SYNTHETIC_ONLY=YES EPMO_LOCAL_DRILL_APPROVED=YES EPMO_PG_IMAGE="$PG_IMAGE" EPMO_LOCAL_DRILL_KEY_FILE="$key_file" node scripts/staging-synthetic-local-recovery.mjs >> "$log_file" 2>&1
            rc=$?
            set -e
          fi
          leftover="$(docker ps -aq --filter 'name=^/epmo-s36-' 2>/dev/null || true)"
          cleanup_ok=true
          if [ -n "$leftover" ]; then
            cleanup_ok=false
            docker rm -f $leftover >/dev/null 2>&1 || true
          fi
          drill_ok=false
          if [ "$rc" -eq 0 ] && grep -Fq 'PASS: LOCAL-ONLY synthetic encrypted backup' "$log_file"; then
            drill_ok=true
          fi
          export EPMO_DRILL_OK="$drill_ok" EPMO_CLEANUP_OK="$cleanup_ok" EPMO_EVIDENCE_FILE="$evidence_file"
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            const pass=process.env.EPMO_DRILL_OK==="true" && process.env.EPMO_CLEANUP_OK==="true";
            const receipt={
              scope:"real disposable GitHub runner Docker/PostgreSQL; synthetic local only",
              acceptance:"NOT off-host backup, public HTTPS staging, or release acceptance",
              runId:process.env.GITHUB_RUN_ID,
              candidateSha:process.env.EXPECTED_SHA,
              postgresImage:process.env.PG_IMAGE,
              executedAtUtc:new Date().toISOString(),
              result:pass?"PASS":"FAIL",
              realDockerPostgresExecuted:process.env.EPMO_DRILL_OK==="true",
              encryptedArchiveRoundtripAndSha256Verified:process.env.EPMO_DRILL_OK==="true",
              twoSyntheticFixtureRowsVerified:process.env.EPMO_DRILL_OK==="true",
              mutatedTargetRolledBackInPlace:process.env.EPMO_DRILL_OK==="true",
              disposableContainersCleaned:process.env.EPMO_CLEANUP_OK==="true",
              externalAcceptance:false,
              commercialDecision:"NO-GO"
            };
            writeFileSync(process.env.EPMO_EVIDENCE_FILE,JSON.stringify(receipt,null,2)+"\n",{mode:0o600});
          '
          echo "Disposable recovery: $drill_ok; cleanup: $cleanup_ok; external acceptance: NOT ACCEPTED"
          test "$drill_ok" = true
          test "$cleanup_ok" = true
      - name: Upload redacted exact-SHA recovery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epmo4-s55-synthetic-recovery-receipt
          path: ${{ runner.temp }}/epmo4-s55-evidence.json
          if-no-files-found: error
          retention-days: 14
