name: Generate final transitive security patches
on:
  push:
    branches: [security/final-transitive-patches-20261109]
    paths: [.github/workflows/final-transitive-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Update vulnerable transitive packages
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='package.json',pkg=JSON.parse(fs.readFileSync(p,'utf8'));
          pkg.pnpm ??= {}; pkg.pnpm.overrides ??= {};
          Object.assign(pkg.pnpm.overrides,{
            'picomatch@^4.0.0':'4.0.4',
            'tmp@^0.2.0':'0.2.7',
            'image-size@^2.0.0':'2.0.3',
            'vite@^8.0.0':'8.2.4'
          });
          fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\n');
          NODE
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - run: pnpm build:packages && pnpm typecheck && npm run test:offline
      - name: Commit reconciled lockfile
        run: |
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): patch remaining compatible transitive vulnerabilities'
          git push origin HEAD:security/final-transitive-patches-20261109
