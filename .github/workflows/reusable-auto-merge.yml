name: Reusable guarded auto-merge

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge only fully checked pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr list --repo "$GH_REPO" --base "$BASE" --state open --limit 100 --json number,isDraft --jq '.[] | select(.isDraft == false) | .number' |
          while read -r pr; do
            [[ -n "$pr" ]] || continue
            data=$(gh pr view "$pr" --repo "$GH_REPO" --json headRepository,mergeable,reviewDecision,labels)
            [[ "$(jq -r '.headRepository.nameWithOwner // ""' <<<"$data")" == "$GH_REPO" ]] || continue
            [[ "$(jq -r '.mergeable' <<<"$data")" == "MERGEABLE" ]] || continue
            [[ "$(jq -r '.reviewDecision' <<<"$data")" != "CHANGES_REQUESTED" ]] || continue
            if jq -e '[.labels[].name] | any(. == "hold" or . == "do-not-merge")' <<<"$data" >/dev/null; then continue; fi
            checks=$(gh pr checks "$pr" --repo "$GH_REPO" --json state 2>/dev/null) || continue
            if ! jq -e 'length > 0 and all(.[]; .state == "SUCCESS" or .state == "SKIPPED" or .state == "NEUTRAL")' <<<"$checks" >/dev/null; then continue; fi
            gh pr merge "$pr" --repo "$GH_REPO" --squash --delete-branch || echo "PR $pr remains open; merge blocked by GitHub"
          done
