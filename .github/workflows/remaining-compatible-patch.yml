name: Generate remaining range-compatible security patches
on:
  push:
    branches: [security/patch-remaining-compatible-20261109]
    paths: [.github/workflows/remaining-compatible-patch.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply narrow transitive overrides and regenerate lockfile
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='package.json', pkg=JSON.parse(fs.readFileSync(p,'utf8'));
          pkg.pnpm ??= {}; pkg.pnpm.overrides ??= {};
          Object.assign(pkg.pnpm.overrides,{
            'glob@^10.0.0': '10.5.0',
            'tmp@^0.2.0': '0.2.6',
            'brace-expansion@^1.0.0': '1.1.20',
            'brace-expansion@^2.0.0': '2.1.6',
            'vite@^8.0.0': '8.2.4'
          });
          fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\n');
          NODE
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Verify workspace package build and type checking
        run: |
          pnpm build:packages
          pnpm typecheck
      - name: Commit only compatible dependency graph changes
        run: |
          set -euo pipefail
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): range-compatible transitive updates [security-lockfile]'
          git push origin HEAD:security/patch-remaining-compatible-20261109
