name: Trial unified Zod 4 upgrade
on:
  push:
    branches: [security/zod4-unified-contracts-20261109]
    paths: [.github/workflows/zod4-unified-trial.yml]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Unify all schema-producing and schema-consuming packages on patched Zod
        run: |
          set -euo pipefail
          pnpm --filter @pmo/contracts add zod@4.6.6
          pnpm --filter @pmo/api add zod@4.6.6
          pnpm --filter @pmo/web add zod@4.6.6
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Verify workspace package build and typecheck
        run: pnpm build:packages && pnpm typecheck
      - name: Verify offline tests
        run: npm run test:offline
      - name: Commit coordinated dependency and lockfile upgrade only if verified
        run: |
          git add packages/contracts/package.json apps/api/package.json apps/web/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): coordinate Zod 4 across schema packages'
          git push origin HEAD:security/zod4-unified-contracts-20261109
