name: One-shot security lockfile refresh (review branch only)
on:
  push:
    branches: [security/p0-next-proxy-drizzle-20261105]
permissions:
  contents: write
jobs:
  update-lockfile:
    if: "!contains(github.event.head_commit.message, '[lockfile-refreshed]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit only the lockfile to this review branch
        run: |
          set -euo pipefail
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(security): refresh locked dependencies [lockfile-refreshed]"
            git push origin HEAD:refs/heads/security/p0-next-proxy-drizzle-20261105
          fi
